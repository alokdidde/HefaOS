# Hefaos Version Tracking
# Single source of truth for all component versions

versions:
  hefaos-core: "0.1.0"
  hefaos-hal: "0.1.0"
  hefaos-ai: "0.1.0"
  hefaos-sdk: "0.1.0"
  hefaos-compiler: "0.1.0"
  hefaos-cli: "0.1.0"

compatibility:
  # SDK version ranges compatible with runtime versions
  "sdk@0.1.x": "runtime@0.1.x"

dependencies:
  # External dependency versions
  iceoryx: "2.0.5"
  flatbuffers: "24.3.25"
  arrow: "15.0.0"
  onnxruntime: "1.17.0"
  tflite: "2.15.0"
  llamacpp: "b2000"

  # Build tools
  cmake: ">=3.25"
  ninja: ">=1.11"
  clang: ">=18"
  node: ">=20"
  pnpm: ">=9"
  python: ">=3.12"

  # Testing
  gtest: "1.14.0"
  vitest: ">=1.0"
  pytest: ">=8.0"
