# ─────────────────────────────────────────────────────────────────────────────
# Hefaos Documentation - MkDocs Configuration
# ─────────────────────────────────────────────────────────────────────────────

site_name: Hefaos Documentation
site_description: Hardware-Efficient Framework for Autonomous Operating Systems
site_url: https://hefaos-robotics.github.io/hefaos
repo_url: https://github.com/hefaos-robotics/hefaos
repo_name: hefaos-robotics/hefaos

copyright: Copyright &copy; 2026 Hefaos Robotics

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - First Robot: getting-started/first-robot.md
  - Tutorials:
      - Simple Arm: tutorials/simple-arm.md
      - Mobile Robot: tutorials/mobile-robot.md
      - Simulation: tutorials/simulation.md
  - Architecture:
      - Overview: architecture/overview.md
      - State Store: architecture/state-store.md
      - Task Graph: architecture/task-graph.md
      - HAL: architecture/hal.md
      - AI Runtime: architecture/ai-runtime.md
  - SDK Reference:
      - Components: api/components.md
      - Tasks: api/tasks.md
      - Behaviors: api/behaviors.md
      - Schemas: api/schemas.md
  - Runtime Reference:
      - Core API: api/runtime-core.md
      - HAL API: api/runtime-hal.md
      - AI API: api/runtime-ai.md
  - Development:
      - Setup: development/setup.md
      - Testing: development/testing.md
      - Cross-compilation: development/cross-compile.md
      - Contributing: development/contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hefaos-robotics
  version:
    provider: mike
